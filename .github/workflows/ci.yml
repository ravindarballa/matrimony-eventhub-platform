name: CI

# Every push and every pull request. The e2e suite starts its own in-memory
# MongoDB replica set, so no service container is needed - which also means the
# pipeline tests the same database topology a developer runs locally.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Angular 22 will not run on anything older.
  NODE_VERSION: '24'
  # Pinned deliberately. npm 11 gates package install scripts behind an approval
  # list, and this project has three packages that need theirs - argon2 most of
  # all, which compiles its native binding during install and is simply broken
  # without it. Whether that gate warns or refuses depends on the exact npm the
  # runner happens to ship, which is not something a build should be at the
  # mercy of. Pinning makes the toolchain a decision rather than an accident.
  NPM_VERSION: '10.9.2'

jobs:
  contracts:
    name: Shared contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Pin npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - run: npm ci
        working-directory: packages/contracts
      - run: npm run build
        working-directory: packages/contracts

      # Both apps import the built output, so it is passed on rather than
      # rebuilt three times.
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-dist
          path: packages/contracts/dist
          retention-days: 1

  api:
    name: API — typecheck, unit, e2e
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Pin npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Build contracts
        working-directory: packages/contracts
        run: npm ci && npm run build

      - name: Install API dependencies
        working-directory: apps/api
        # Foreground output, so a failing native build (argon2 compiles from
        # source when no prebuild matches the runner) shows its actual error
        # rather than a bare non-zero exit.
        run: npm ci --foreground-scripts

      # A failed install is otherwise invisible: npm writes the real cause to
      # its own log file and prints a one-line summary. Surfacing it here means
      # the next red build is diagnosable without a rerun.
      - name: Show the npm log if the install failed
        if: failure()
        run: |
          echo "::group::npm debug log"
          tail -n 200 ~/.npm/_logs/*.log || echo "(no npm log found)"
          echo "::endgroup::"

      # --- temporary diagnosis ------------------------------------------------
      # The install fails on the runner but not locally, and job logs need a
      # token to read. These probes each pass only if the npm log contains the
      # error code they are named after, so the failure can be identified from
      # the step outcomes alone. Remove once the cause is fixed.
      # --- temporary diagnosis ------------------------------------------------
      # Each probe passes only when the log matches, so the cause is readable
      # from step outcomes alone. npm 10 writes "npm ERR! code X" and npm 11
      # writes "npm error code X", so the pattern matches either.
      - name: 'code EUSAGE'
        if: failure()
        run: grep -qE "(ERR!|error) code EUSAGE" ~/.npm/_logs/*.log

      - name: 'code EJSONPARSE'
        if: failure()
        run: grep -qE "(ERR!|error) code EJSONPARSE" ~/.npm/_logs/*.log

      - name: 'code ENOENT'
        if: failure()
        run: grep -qE "(ERR!|error) code ENOENT" ~/.npm/_logs/*.log

      - name: 'code EBADENGINE'
        if: failure()
        run: grep -qE "(ERR!|error) code EBADENGINE" ~/.npm/_logs/*.log

      - name: 'code ERESOLVE'
        if: failure()
        run: grep -qE "(ERR!|error) code ERESOLVE" ~/.npm/_logs/*.log

      - name: 'code EACCES'
        if: failure()
        run: grep -qE "(ERR!|error) code EACCES" ~/.npm/_logs/*.log

      - name: 'code E404'
        if: failure()
        run: grep -qE "(ERR!|error) code E404" ~/.npm/_logs/*.log

      - name: 'code ELIFECYCLE'
        if: failure()
        run: grep -qE "(ERR!|error) code ELIFECYCLE" ~/.npm/_logs/*.log

      - name: 'code EINTEGRITY'
        if: failure()
        run: grep -qE "(ERR!|error) code EINTEGRITY" ~/.npm/_logs/*.log

      - name: 'code EEXIST'
        if: failure()
        run: grep -qE "(ERR!|error) code EEXIST" ~/.npm/_logs/*.log

      - name: 'text: lock out of sync'
        if: failure()
        run: grep -q "can only install packages when your package.json" ~/.npm/_logs/*.log

      - name: 'text: mentions contracts link'
        if: failure()
        run: grep -qi "contracts" ~/.npm/_logs/*.log

      - name: 'a log for this run exists at all'
        if: failure()
        run: test -n "$(find ~/.npm/_logs -newermt '-3 minutes' -name '*.log' 2>/dev/null)"

      - name: 'npm log head'
        if: failure()
        run: head -60 ~/.npm/_logs/*.log
      # --- end temporary diagnosis --------------------------------------------

      # mongodb-memory-server downloads a mongod binary on first use; caching it
      # keeps the e2e job off the network on every run after the first.
      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongo-binaries-${{ runner.os }}

      - name: Typecheck
        working-directory: apps/api
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: apps/api
        run: npm test

      - name: End-to-end tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          # Only used by the config validation at boot; the e2e suite builds its
          # own module and never reads a real .env.
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci-only-secret-at-least-32-characters-long
          JWT_REFRESH_SECRET: ci-only-different-secret-32-chars-min

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Build contracts
        working-directory: packages/contracts
        run: npm ci && npm run build

      - run: npm ci
        working-directory: apps/web

      # A production build is the typecheck: the Angular compiler checks every
      # template, which tsc alone does not.
      - name: Production build
        working-directory: apps/web
        run: npm run build -- --configuration production

  # A single required check, so branch protection has one box to tick rather
  # than a list that has to be edited whenever a job is added.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [api, web]
    if: always()
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed."
